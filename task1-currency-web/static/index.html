    PURPOSE: Разметка веб-конвертера валют: форма конвертации и таблица курсов.
    SCOPE: Статическая структура страницы; логика — в app.js.
    DEPENDS: M-T1-API
    LINKS: M-T1-FRONTEND
    ROLE: UI_COMPONENT
    MAP_MODE: NONE
  END_MODULE_CONTRACT
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конвертер валют ЦБ РФ</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Конвертер валют</h1>
      <p class="app__subtitle">По официальным курсам ЦБ РФ</p>
    </header>

    <!-- Баннер ошибки: показывается при сбоях загрузки или конвертации -->
    <div id="error-banner" class="banner banner--error" hidden></div>

    <section class="card converter" aria-label="Конвертация валют">
      <div class="field">
        <label class="field__label" for="amount">Сумма</label>
        <input
          id="amount" class="field__input" type="number"
          min="0" step="any" value="1000" inputmode="decimal" />
      </div>

      <div class="converter__currencies">
        <div class="field">
          <label class="field__label" for="from-code">Из валюты</label>
          <select id="from-code" class="field__input"></select>
        </div>

        <button id="swap" class="swap-btn" type="button" title="Поменять валюты местами"
          aria-label="Поменять валюты местами">⇅</button>

        <div class="field">
          <label class="field__label" for="to-code">В валюту</label>
          <select id="to-code" class="field__input"></select>
        </div>
      </div>

      <button id="convert" class="btn-primary" type="button">Конвертировать</button>

      <output id="result" class="result" hidden></output>
    </section>

    <section class="card" aria-label="Курсы валют">
      <h2 class="card__title">Курсы на <span id="rates-date">—</span></h2>
      <div class="table-wrap">
        <table class="rates">
          <thead>
            <tr>
              <th>Код</th><th>Валюта</th><th class="num">Курс, ₽</th><th class="num">Δ за сутки</th>
            </tr>
          </thead>
          <tbody id="rates-body">
            <tr><td colspan="4" class="rates__loading">Загрузка курсов…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="app__footer">
      Источник данных: <a href="https://www.cbr-xml-daily.ru" target="_blank"
        rel="noopener">cbr-xml-daily.ru</a>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
