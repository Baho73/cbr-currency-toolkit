# nginx reverse proxy для веб-конвертера валют.
# Боевая конфигурация: https://converter.teamplan.ru
#
# Установка: положить в /etc/nginx/sites-enabled/converter.teamplan.ru,
# выполнить `nginx -t && systemctl reload nginx`.
# Контейнер приложения слушает 127.0.0.1:8003 (наружу не открыт — точка входа только nginx).

server {
    listen 80;
    listen [::]:80;
    server_name converter.teamplan.ru;

    # Валидация Let's Encrypt (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
        auth_basic off;
    }

    # Весь остальной HTTP-трафик — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name converter.teamplan.ru;

    ssl_certificate     /etc/letsencrypt/live/converter.teamplan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/converter.teamplan.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
